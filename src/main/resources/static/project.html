<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DevMap</title>
  <link rel="stylesheet" href="/assets/app.css">
  <script type="module" src="/assets/project.js"></script>
</head>
<body>
  <header class="topbar">
    <a href="/" class="brand">DevMap</a>
    <span class="dot" id="project-dot"></span>
    <strong id="project-name"></strong>
    <nav>
      <a class="tab" href="#" data-view="overview" data-i18n="overview"></a>
      <a class="tab" href="#graph" data-view="graph" data-i18n="graph"></a>
      <a class="tab" href="#rules" data-view="rules" data-i18n="rulesNav"></a>
      <a class="tab" href="#config" data-view="config" data-i18n="projectConfig"></a>
    </nav>
    <span class="spacer"></span>
    <label><span class="sr-only" data-i18n="language"></span><select id="lang"></select></label>
  </header>
  <div class="cols">
    <aside class="col left">
      <div class="row">
        <h3 class="grow" data-i18n="tasks"></h3>
        <a class="primary small" href="#new" data-i18n="newTicket"></a>
      </div>
      <div class="row filters">
        <select id="filter-status"></select>
        <select id="filter-type"></select>
      </div>
      <ul id="task-list" class="task-list"></ul>
      <div id="queue"></div>
    </aside>
    <main class="col mid" id="mid"></main>
    <aside class="col right" id="right"></aside>
  </div>
</body>
</html>
