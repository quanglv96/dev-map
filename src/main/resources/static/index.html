<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DevMap</title>
  <link rel="stylesheet" href="/assets/app.css">
  <script type="module" src="/assets/home.js"></script>
</head>
<body>
  <header class="topbar">
    <strong>DevMap</strong>
    <span class="spacer"></span>
    <label><span class="sr-only" data-i18n="language"></span><select id="lang"></select></label>
  </header>
  <main class="home">
    <div class="grid2">
      <section class="card">
        <h2 data-i18n="pending"></h2>
        <div id="pending"></div>
      </section>
      <section class="card">
        <h2 data-i18n="running"></h2>
        <div id="running"></div>
      </section>
    </div>
    <section class="card">
      <h2 data-i18n="projects"></h2>
      <div id="projects"></div>
    </section>
    <section class="card">
      <h2 data-i18n="sync.title"></h2>
      <h3 class="section" data-i18n="sync.cloneTitle"></h3>
      <div id="sync-clone" class="form"></div>
      <h3 class="section" data-i18n="sync.importTitle"></h3>
      <div class="row">
        <input type="file" id="import-file" accept=".zip">
        <button type="button" id="import-zip" data-i18n="sync.import"></button>
      </div>
      <small class="muted" data-i18n="sync.importHint"></small>
      <div id="import-result"></div>
    </section>
    <section class="card">
      <h2 data-i18n="addProject"></h2>
      <form id="add-form" class="form">
        <label><span data-i18n="name"></span>
          <input name="name" required pattern="[a-z0-9][a-z0-9\-]{0,39}" placeholder="nyxhub">
        </label>
        <label><span data-i18n="color"></span>
          <input name="color" type="color" value="#2563eb">
        </label>
        <label><span data-i18n="dataRoot"></span>
          <span class="row">
            <input name="dataRoot" required placeholder="D:/devmap-data">
            <button type="button" id="pick-data" data-i18n="browse"></button>
          </span>
          <small class="muted" data-i18n="dataRootHint"></small>
        </label>
        <div id="data-folders"></div>
        <label><span data-i18n="projectRoot"></span>
          <span class="row">
            <input id="project-root" readonly>
            <button type="button" id="pick-project" data-i18n="browse"></button>
          </span>
          <small class="muted" data-i18n="projectRootHint"></small>
        </label>
        <fieldset>
          <legend data-i18n="repos"></legend>
          <div id="repo-rows"></div>
          <button type="button" id="add-repo" class="link" data-i18n="addRepo"></button>
        </fieldset>
        <div id="add-error"></div>
        <button type="submit" class="primary" data-i18n="create"></button>
      </form>
    </section>
  </main>
</body>
</html>
