openapi: 3.0.3
info:
  title: Payment API
  version: 1.0.0
paths:
  /api/payments:
    post:
      operationId: createPayment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentRequest'
      responses:
        '200':
          description: Payment result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentResult'
  /api/payments/{id}:
    get:
      operationId: getPayment
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '200':
          description: Payment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentResult'
components:
  schemas:
    PaymentRequest:
      type: object
      required: [orderId, amount]
      properties:
        orderId: { type: integer, format: int64 }
        amount: { type: number }
    PaymentResult:
      type: object
      properties:
        id: { type: integer, format: int64 }
        orderId: { type: integer, format: int64 }
        status: { type: string, enum: [PAID, FAILED] }
